[project]
name = "gilbert-trader"
version = "0.1.0"
description = "Paper-trading bot with hard risk limits and a Claude-driven strategy"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
